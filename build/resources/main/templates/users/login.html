<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4"
  >
    <div class="w-full max-w-md shadow-lg bg-white rounded-lg">
      <div class="p-6 space-y-1">
        <h1 class="text-center text-2xl font-bold">ログイン</h1>
        <p class="text-center text-gray-600">
          アカウントにサインインしてください
        </p>
      </div>
      <div class="p-6">
        <form th:action="@{/login}" method="post" class="space-y-4">
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium"
              >メールアドレス</label
            >
            <div class="relative">
              <input
                id="email"
                name="username"
                type="email"
                placeholder="your-email@example.com"
                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required
              />
            </div>
          </div>

          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium"
              >パスワード</label
            >
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="パスワードを入力してください"
                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required
              />
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <input
                id="remember"
                name="remember-me"
                type="checkbox"
                class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
              />
              <label for="remember" class="text-sm">ログイン状態を保持</label>
            </div>
            <a href="#" class="text-sm text-blue-600 hover:underline"
              >パスワードを忘れた方</a
            >
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            ログイン
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
          アカウントをお持ちでない方は
          <a href="/register" class="text-blue-600 hover:underline">新規登録</a>
        </div>
      </div>
    </div>
  </body>
</html>
