spring:
  datasource:
    # テスト環境ではH2をPostgreSQL互換モードで使用（高速）
    # MODE=PostgreSQL で PostgreSQL互換の構文を使用可能にする
    # PostgreSQLでテストする場合は環境変数を設定
    url: ${TEST_DATABASE_URL:jdbc:h2:mem:integrationtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${TEST_DATABASE_DRIVER:org.h2.Driver}
    username: ${TEST_DATABASE_USERNAME:sa}
    password: ${TEST_DATABASE_PASSWORD:}
    initialization-mode: never
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: ${TEST_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  h2:
    console:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email