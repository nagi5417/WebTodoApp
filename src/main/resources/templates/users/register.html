<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header">
                    <h3 class="text-center">ユーザー登録</h3>
                </div>
                <div class="card-body">

                    <!-- エラーメッセージ表示 -->
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/users/register}" method="post" th:object="${userRegistrationDto}">

                        <!-- 名前入力欄 -->
                        <div class="mb-3">
                            <label for="username" class="form-label">お名前</label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="山田太郎">
                            <div th:if="${#fields.hasErrors('username')}" class="text-danger" th:errors="*{username}"></div>
                        </div>

                        <!-- メールアドレス入力欄 -->
                        <div class="mb-3">
                            <label for="email" class="form-label">メールアドレス</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="example@email.com">
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
                        </div>

                        <!-- パスワード入力欄 -->
                        <div class="mb-3">
                            <label for="password" class="form-label">パスワード</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="8文字以上で入力">
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></div>
                        </div>

                        <!-- パスワード確認入力欄 -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">パスワード確認</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" placeholder="パスワードを再入力">
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger" th:errors="*{confirmPassword}"></div>
                        </div>

                        <!-- 登録ボタン -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">登録する</button>
                        </div>

                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/users/login}">ログイン</a>
                    </div>

                </div>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
